name: express-base

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-base-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/express_base?schema=public
      # MONGODB_URI: mongodb://mongo:27017/express_base
      # MYSQL_URL: mysql://root:root@mysql:3306/express_base
      # REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      # mongo:
      #   condition: service_healthy
      # mysql:
      #   condition: service_healthy
      # redis:
      #   condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: express-base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: express_base
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d express_base']
      interval: 5s
      timeout: 5s
      retries: 10

