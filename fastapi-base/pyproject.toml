[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-base"
version = "1.0.0"
description = "Python FastAPI backend starter with optional session authentication"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
