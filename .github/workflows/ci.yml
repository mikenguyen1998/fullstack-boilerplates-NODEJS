name: CI

on:
  push:
    branches: [main, without-auth]
  pull_request:

jobs:
  python:
    name: fastapi-base
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fastapi-base/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  check:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: react-withoutauth
            lint: lint
          - project: react-auth
            lint: lint
          - project: nextjs-auth
            lint: lint
          - project: nextjs-withoutauth
            lint: lint
          - project: express-base
            lint: lint
            pre: npm run prisma:generate
          - project: nestjs-base
            lint: lint:check
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: if [ -f .env.example ]; then cp .env.example .env; fi
      - run: npm ci
      - if: matrix.pre
        run: ${{ matrix.pre }}
      - run: npm run ${{ matrix.lint }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
