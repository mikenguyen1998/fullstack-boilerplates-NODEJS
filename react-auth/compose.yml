services:
  web:
    build: .
    ports:
      - '8080:80'
    depends_on:
      - backend
  backend:
    build: ../fastapi-base
    environment:
      AUTH_EMAIL: ${AUTH_EMAIL:?Set AUTH_EMAIL}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Set AUTH_PASSWORD_HASH}
      AUTH_ORIGINS: http://localhost:8080
      AUTH_DATABASE: /app/data/auth.sqlite3
    volumes:
      - auth-data:/app/data
volumes:
  auth-data:
